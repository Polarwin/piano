<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17120f"><title>Piano Studio</title>
  <style>
    :root{color-scheme:dark;--ink:#f6efe4;--muted:#b8aa9c;--wine:#9e3950;--gold:#d4a85d;--panel:#241c18;--line:#42342d}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#39241f 0,transparent 42%),#17120f;color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100vh}
    main{width:min(760px,100%);margin:auto;padding:28px 18px 70px}.eyebrow{color:var(--gold);font-size:.73rem;letter-spacing:.18em;text-transform:uppercase}h1{font:500 clamp(2.4rem,11vw,5rem)/.95 Georgia,serif;margin:.28em 0 .22em}.lead{color:var(--muted);max-width:580px;margin:0 0 28px}
    .card{background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 60px #0005}label{display:block;font-size:.8rem;color:var(--muted);margin:0 0 7px}.field{margin-bottom:16px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#130f0d;color:var(--ink);padding:13px 14px;font:inherit;outline:none}textarea{min-height:118px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:var(--gold)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;align-items:center;gap:10px;color:var(--ink);margin:4px 0 18px}.toggle input{width:20px;height:20px;accent-color:var(--wine)}button{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,var(--wine),#bd5268);color:white;font-weight:700;font-size:1rem;box-shadow:0 8px 25px #9e395044}button:disabled{opacity:.55}
    #status{display:none;margin-top:15px;padding:13px;border-radius:12px;background:#15100e;color:var(--muted)}#status.show{display:block}.status-line{display:flex;justify-content:space-between;gap:12px}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px;animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}.progress{height:9px;margin:11px 0 8px;border-radius:99px;background:#342721;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--wine),var(--gold));transition:width .6s ease}.job-meta{font-size:.75rem;color:#8f8175}.debug{margin-top:8px;font-size:.78rem}.debug summary{cursor:pointer;color:var(--gold)}.debug pre{white-space:pre-wrap;word-break:break-word;margin:7px 0 0;color:#a99b8e;font:inherit}
    h2{font:500 1.55rem Georgia,serif;margin:38px 0 12px}.piece{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}.piece-name{font-weight:600}.links{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.links a{font-size:.75rem;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:5px 8px;text-transform:uppercase}.empty{color:var(--muted)}
    @media(max-width:520px){main{padding-top:22px}.row{grid-template-columns:1fr}.piece{align-items:flex-start;flex-direction:column}.links{justify-content:flex-start}.card{padding:17px}}
  </style>
</head>
<body><main>
  <div class="eyebrow">AI composition for solo piano</div><h1>Piano Studio</h1>
  <p class="lead">Describe a feeling, scene, or musical idea. Receive an original score you can read, hear, and play.</p>
  <form class="card" id="composer">
    <div class="field"><label for="prompt">What should the music feel like?</label><textarea id="prompt" required minlength="5" placeholder="A tender nocturne in E minor, romantic and wistful, with a warm ending…"></textarea></div>
    <div class="row"><div class="field"><label for="title">Title (optional)</label><input id="title" maxlength="100" placeholder="Moonlit Letter"></div><div class="field"><label for="provider">Create with</label><select id="provider"><option value="kimi" selected>Kimi</option><option value="codex">Codex</option></select></div></div>
    <div class="field"><label for="bars">Length</label><select id="bars"><option value="16">Short · 16 measures</option><option value="24">About 1–2 minutes</option><option value="32" selected>About 2 minutes</option><option value="48">About 3 minutes</option><option value="64">About 4–5 minutes</option></select></div>
    <label class="toggle"><input type="checkbox" id="audio" checked> Render playable MP3 and WAV audio</label>
    <button id="create">Compose my piano piece</button><div id="status" role="status" aria-live="polite"></div>
  </form>
  <h2>Your music library</h2><div id="library"><p class="empty">Loading your pieces…</p></div>
</main><script>
const form=document.querySelector('#composer'),promptInput=document.querySelector('#prompt'),titleInput=document.querySelector('#title'),provider=document.querySelector('#provider'),barsSelect=document.querySelector('#bars'),audioInput=document.querySelector('#audio'),statusBox=document.querySelector('#status'),button=document.querySelector('#create'),library=document.querySelector('#library');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadLibrary(){try{let r=await fetch('api/library'),d=await r.json();library.innerHTML=d.pieces.length?d.pieces.map(p=>`<div class="piece"><span class="piece-name">${esc(p.name)}</span><span class="links">${Object.entries(p.files).map(([k,v])=>`<a href="${encodeURI(v)}" target="_blank">${esc(k)}</a>`).join('')}</span></div>`).join(''):'<p class="empty">Your first composition will appear here.</p>'}catch{library.innerHTML='<p class="empty">Could not load the library.</p>'}}
function show(msg,busy=true){statusBox.className='show';statusBox.innerHTML=`${busy?'<span class="pulse"></span>':''}${esc(msg)}`}
function showJob(j){let busy=j.status!=='error'&&j.status!=='complete',pct=Math.max(0,Math.min(100,j.progress||0));statusBox.className='show';statusBox.innerHTML=`<div class="status-line"><span>${busy?'<span class="pulse"></span>':''}${esc(j.message||j.status)}</span><strong>${pct}%</strong></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="progress-bar" style="width:${pct}%"></div></div><div class="job-meta">${esc(j.stage||'Working')} · ${j.elapsed||0}s · ${esc((j.composer||'').toUpperCase())} · job ${esc((j.id||'').slice(0,8))}</div><details class="debug"><summary>Technical details</summary><pre>${esc(j.diagnostic||'No additional details.')}</pre></details>`}
async function poll(id){try{let r=await fetch(`api/jobs/${id}`,{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||`Status request failed (${r.status})`);showJob(j);if(j.status==='complete'){button.disabled=false;button.textContent='Compose another piece';await loadLibrary();return}if(j.status==='error'){button.disabled=false;button.textContent='Try again';return}}catch(e){statusBox.className='show';statusBox.innerHTML=`<div class="status-line"><span>Connection interrupted; retrying…</span></div><div class="job-meta">${esc(e.message)} · job ${esc(id.slice(0,8))}</div>`}setTimeout(()=>poll(id),2000)}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;show(`Preparing your ${provider.options[provider.selectedIndex].text} composition…`);try{let r=await fetch('api/compose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:promptInput.value,title:titleInput.value,composer:provider.value,bars:+barsSelect.value,audio:audioInput.checked})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not start composition');poll(d.id)}catch(e){show(e.message,false);button.disabled=false}});loadLibrary();
</script></body></html>
