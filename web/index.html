<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17120f"><title>Piano Studio</title>
  <style>
    :root{color-scheme:dark;--ink:#f6efe4;--muted:#b8aa9c;--wine:#9e3950;--gold:#d4a85d;--panel:#241c18;--line:#42342d}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#39241f 0,transparent 42%),#17120f;color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100vh}
    main{width:min(760px,100%);margin:auto;padding:28px 18px 70px}.eyebrow{color:var(--gold);font-size:.73rem;letter-spacing:.18em;text-transform:uppercase}h1{font:500 clamp(2.4rem,11vw,5rem)/.95 Georgia,serif;margin:.28em 0 .22em}.lead{color:var(--muted);max-width:580px;margin:0 0 28px}
    .card{background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 60px #0005}label{display:block;font-size:.8rem;color:var(--muted);margin:0 0 7px}.field{margin-bottom:16px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#130f0d;color:var(--ink);padding:13px 14px;font:inherit;outline:none}textarea{min-height:118px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:var(--gold)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;align-items:center;gap:10px;color:var(--ink);margin:4px 0 18px}.toggle input{width:20px;height:20px;accent-color:var(--wine)}button{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,var(--wine),#bd5268);color:white;font-weight:700;font-size:1rem;box-shadow:0 8px 25px #9e395044}button:disabled{opacity:.55}
    #status{display:none;margin-top:15px;padding:13px;border-radius:12px;background:#15100e;color:var(--muted)}#status.show{display:block}.status-line{display:flex;justify-content:space-between;gap:12px}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px;animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}.progress{height:9px;margin:11px 0 8px;border-radius:99px;background:#342721;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--wine),var(--gold));transition:width .6s ease}.job-meta{font-size:.75rem;color:#8f8175}.debug{margin-top:8px;font-size:.78rem}.debug summary{cursor:pointer;color:var(--gold)}.debug pre{white-space:pre-wrap;word-break:break-word;margin:7px 0 0;color:#a99b8e;font:inherit}
    h2{font:500 1.55rem Georgia,serif;margin:38px 0 12px}.piece{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}.piece-name{font-weight:600}.links{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.links a{font-size:.75rem;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:5px 8px;text-transform:uppercase}.empty{color:var(--muted)}.sec-link{font:400 .8rem system-ui,sans-serif;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px;margin-left:10px;vertical-align:middle}
    .userbar{display:flex;gap:10px;align-items:center;margin:0 0 8px;flex-wrap:wrap}.userbar label{font-size:.8rem;color:var(--muted)}.userbar input{max-width:200px;border:1px solid var(--line);border-radius:10px;background:#130f0d;color:var(--ink);padding:8px 11px;font:inherit;outline:none}.toggle-sm{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}.toggle-sm input{accent-color:var(--wine)}.who{display:block;color:#8f8175;font-size:.75rem;font-weight:400;margin-top:3px}.links a.done.on{background:var(--wine);border-color:var(--wine);color:#fff}
    @media(max-width:520px){main{padding-top:22px}.row{grid-template-columns:1fr}.piece{align-items:flex-start;flex-direction:column}.links{justify-content:flex-start}.card{padding:17px}}
  </style>
</head>
<body><main>
  <div class="eyebrow">Learn piano, one prompt at a time</div><h1>Piano Studio</h1>
  <p class="lead">Your piano lessons live here — read them, listen to them, or create a new one from any idea. Original pieces from a prompt are below.</p>
  <h2 id="lessons">Piano lessons</h2>
  <div class="userbar"><label for="user-name">Who is practicing?</label><input id="user-name" list="known-users" maxlength="24" placeholder="Your name"><datalist id="known-users"></datalist><label class="toggle-sm"><input type="checkbox" id="hide-done"> hide my finished</label></div>
  <div id="lessons-list"><p class="empty">Loading lessons…</p></div>
  <a href="#" class="sec-link" id="lessons-more" hidden></a>
  <form class="card" id="lesson-form">
    <div class="field"><label for="lesson-prompt">What should the lesson teach?</label><textarea id="lesson-prompt" required minlength="5" placeholder="A gentle lesson introducing the C major chord for an adult beginner, with hands-together practice…"></textarea></div>
    <div class="row"><div class="field"><label for="lesson-title">Title (optional)</label><input id="lesson-title" maxlength="100" placeholder="Day Three — Your First Chord"></div><div class="field"><label for="lesson-provider">Create with</label><select id="lesson-provider"><option value="kimi" selected>Kimi</option><option value="codex">Codex</option></select></div></div>
    <button id="create-lesson" type="submit">Create piano lesson</button>
  </form><div id="status" role="status" aria-live="polite"></div>
  <h2>Compose a piece</h2>
  <form class="card" id="composer">
    <div class="field"><label for="prompt">What should the music feel like?</label><textarea id="prompt" required minlength="5" placeholder="A tender nocturne in E minor, romantic and wistful, with a warm ending…"></textarea></div>
    <div class="row"><div class="field"><label for="title">Title (optional)</label><input id="title" maxlength="100" placeholder="Moonlit Letter"></div><div class="field"><label for="provider">Create with</label><select id="provider"><option value="kimi" selected>Kimi</option><option value="codex">Codex</option></select></div></div>
    <div class="field"><label for="bars">Length</label><select id="bars"><option value="16">Short · 16 measures</option><option value="24">About 1–2 minutes</option><option value="32" selected>About 2 minutes</option><option value="48">About 3 minutes</option><option value="64">About 4–5 minutes</option></select></div>
    <label class="toggle"><input type="checkbox" id="audio" checked> Render playable MP3 and WAV audio</label>
    <button id="create">Compose my piano piece</button>
  </form>
  <h2>Your music library</h2><div id="library"><p class="empty">Loading your pieces…</p></div>
</main><script>
const form=document.querySelector('#composer'),promptInput=document.querySelector('#prompt'),titleInput=document.querySelector('#title'),provider=document.querySelector('#provider'),barsSelect=document.querySelector('#bars'),audioInput=document.querySelector('#audio'),statusBox=document.querySelector('#status'),button=document.querySelector('#create'),library=document.querySelector('#library'),lessonsList=document.querySelector('#lessons-list'),lessonForm=document.querySelector('#lesson-form'),lessonPrompt=document.querySelector('#lesson-prompt'),lessonTitle=document.querySelector('#lesson-title'),lessonProvider=document.querySelector('#lesson-provider'),lessonButton=document.querySelector('#create-lesson'),userInput=document.querySelector('#user-name');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const render=p=>`<div class="piece"><span class="piece-name">${esc(p.name)}</span><span class="links">${Object.entries(p.files).map(([k,v])=>`<a href="${encodeURI(v)}" target="_blank">${esc(k)}</a>`).join('')}</span></div>`;
let progress={},lessonsData=[],lessonsExpanded=false;
const hideDoneInput=document.querySelector('#hide-done'),moreLink=document.querySelector('#lessons-more');
hideDoneInput.checked=localStorage.getItem('piano-hide-done')==='1';
hideDoneInput.addEventListener('change',()=>{localStorage.setItem('piano-hide-done',hideDoneInput.checked?'1':'0');renderLessons()});
moreLink.addEventListener('click',e=>{e.preventDefault();lessonsExpanded=!lessonsExpanded;renderLessons()});
userInput.value=localStorage.getItem('piano-user')||'';
userInput.addEventListener('change',()=>{localStorage.setItem('piano-user',userInput.value.trim());renderLessons()});
function renderLessons(){let me=userInput.value.trim();
  let items=lessonsData.filter(p=>!(hideDoneInput.checked&&me&&Object.keys(progress[p.stem]||{}).some(u=>u.toLowerCase()===me.toLowerCase())));
  let shown=lessonsExpanded?items:items.slice(0,5);
  lessonsList.innerHTML=items.length?shown.map(p=>{let doneBy=Object.keys(progress[p.stem]||{}).sort(),mine=me&&doneBy.some(u=>u.toLowerCase()===me.toLowerCase());return `<div class="piece"><span class="piece-name">${esc(p.name)}${doneBy.length?`<span class="who">✓ ${doneBy.map(esc).join(', ')}</span>`:''}</span><span class="links">${me?`<a href="#" class="done${mine?' on':''}" data-stem="${esc(p.stem)}" data-mine="${mine?1:0}">${mine?'✓ done':'mark done'}</a>`:''}${Object.entries(p.files).map(([k,v])=>`<a href="${encodeURI(v)}" target="_blank">${esc(k)}</a>`).join('')}</span></div>`}).join(''):(lessonsData.length?'<p class="empty">All visible lessons finished — nicely done. Untick “hide my finished” to review them.</p>':'<p class="empty">No lessons yet — create one below.</p>');
  moreLink.hidden=items.length<=5;
  moreLink.textContent=lessonsExpanded?'show less ▴':`show all ${items.length} lessons ▾`;
  // Suggest the next lesson from the current user's progress.
  let days=lessonsData.map(p=>{let m=p.name.match(/^day\s*(\d+)/i);return m?+m[1]:null}).filter(x=>x);
  if(me&&days.length){
    let maxDay=Math.max(...days);
    let doneDays=new Set(lessonsData.filter(p=>Object.keys(progress[p.stem]||{}).some(u=>u.toLowerCase()===me.toLowerCase())).map(p=>{let m=p.name.match(/^day\s*(\d+)/i);return m?+m[1]:null}));
    let next=1;while(next<=maxDay&&doneDays.has(next))next++;
    lessonTitle.placeholder=`Day ${next} — …`;
    if(next<=maxDay){
      lessonPrompt.placeholder=`Next up for you: Day ${next} — it's already in the list above. Or describe a different lesson…`;
    }else{
      lessonPrompt.placeholder=`e.g. "Day ${next} piano lesson for an adult beginner who finished days 1–${maxDay}: the next gentle step, with short exercises"`;
    }}}
async function loadProgress(){try{let r=await fetch('api/progress');progress=await r.json();let users=[...new Set(Object.values(progress).flatMap(e=>Object.keys(e)))].sort();document.querySelector('#known-users').innerHTML=users.map(u=>`<option value="${esc(u)}">`).join('')}catch{}}
lessonsList.addEventListener('click',async e=>{let a=e.target.closest('a.done');if(!a)return;e.preventDefault();let me=userInput.value.trim();if(!me)return;try{let r=await fetch('api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:me,stem:a.dataset.stem,done:a.dataset.mine!=='1'})});if(r.ok){progress=await r.json();renderLessons()}}catch{}});
async function loadLibrary(){try{let r=await fetch('api/library'),d=await r.json();let pieces=d.pieces.filter(p=>!p.lesson),lessons=d.pieces.filter(p=>p.lesson);library.innerHTML=pieces.length?pieces.map(render).join(''):'<p class="empty">Your first composition will appear here.</p>';lessonsData=lessons.sort((a,b)=>{let d=s=>{let m=s.match(/^day\s*(\d+)/i);return m?0:1},n=s=>{let m=s.match(/^day\s*(\d+)/i);return m?+m[1]:0};return d(a.name)-d(b.name)||n(a.name)-n(b.name)||a.name.localeCompare(b.name)});renderLessons()}catch{library.innerHTML='<p class="empty">Could not load the library.</p>'}}
function show(msg,busy=true){statusBox.className='show';statusBox.innerHTML=`${busy?'<span class="pulse"></span>':''}${esc(msg)}`}
function showJob(j){let busy=j.status!=='error'&&j.status!=='complete',pct=Math.max(0,Math.min(100,j.progress||0));statusBox.className='show';statusBox.innerHTML=`<div class="status-line"><span>${busy?'<span class="pulse"></span>':''}${esc(j.message||j.status)}</span><strong>${pct}%</strong></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="progress-bar" style="width:${pct}%"></div></div><div class="job-meta">${esc(j.stage||'Working')} · ${j.elapsed||0}s · ${esc((j.composer||'').toUpperCase())} · job ${esc((j.id||'').slice(0,8))}</div><details class="debug"><summary>Technical details</summary><pre>${esc(j.diagnostic||'No additional details.')}</pre></details>`}
async function poll(id,btn,again){try{let r=await fetch(`api/jobs/${id}`,{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||`Status request failed (${r.status})`);showJob(j);if(j.status==='complete'){btn.disabled=false;btn.textContent=again;await loadLibrary();return}if(j.status==='error'){btn.disabled=false;btn.textContent='Try again';return}}catch(e){statusBox.className='show';statusBox.innerHTML=`<div class="status-line"><span>Connection interrupted; retrying…</span></div><div class="job-meta">${esc(e.message)} · job ${esc(id.slice(0,8))}</div>`}setTimeout(()=>poll(id,btn,again),2000)}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;show(`Preparing your ${provider.options[provider.selectedIndex].text} composition…`);try{let r=await fetch('api/compose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:promptInput.value,title:titleInput.value,composer:provider.value,bars:+barsSelect.value,audio:audioInput.checked})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not start composition');poll(d.id,button,'Compose another piece')}catch(e){show(e.message,false);button.disabled=false}});
lessonForm.addEventListener('submit',async e=>{e.preventDefault();lessonButton.disabled=true;show('Preparing your lesson…');try{let r=await fetch('api/lesson',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:lessonPrompt.value,title:lessonTitle.value,composer:lessonProvider.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not start lesson');if(d.status==='exists'){show(d.message,false);lessonButton.disabled=false;await loadLibrary();return}poll(d.id,lessonButton,'Create another lesson')}catch(e){show(e.message,false);lessonButton.disabled=false}});loadLibrary();loadProgress();
</script></body></html>
